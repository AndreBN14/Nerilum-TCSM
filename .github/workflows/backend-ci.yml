
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pytest (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download ONNX model
        env:
          MODEL_URL: https://github.com/carlos-cas3/G1-TCSM-APP_MOVIL/raw/refs/heads/main/02_robust_cv_pipeline/Yolo_5_CV/weights/final/best.onnx
        run: python scripts/download_model.py

      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Deploy to Render (backend)
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    concurrency:
      group: backend-deploy-${{ github.ref }}
      cancel-in-progress: true

    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACK }}

    steps:
      - name: Trigger Render deploy
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        working-directory: .
        run: |
          curl -X POST \
            -fsS \
            --retry 3 \
            --retry-all-errors \
            "$RENDER_DEPLOY_HOOK"
