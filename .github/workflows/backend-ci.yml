name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: back

jobs:
  tests:
    name: Pytest (Python 3.12)
    runs-on: ubuntu-latest
    env:
      # PAT del secret MODEL_TOKEN para bajar el asset del release privado.
      MODEL_TOKEN: ${{ secrets.MODEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify private release access
        env:
          MODEL_TOKEN: ${{ secrets.MODEL_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = "https://api.github.com/repos/AndreBN14/Nerilum-TCSM/releases/tags/v1.0.0"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['MODEL_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })

          try:
              with urllib.request.urlopen(req) as response:
                  release = json.load(response)
              print("Release encontrado:", release["tag_name"])
              print("Assets publicados:")
              for asset in release.get("assets", []):
                  print("-", asset["name"])
          except urllib.error.HTTPError as error:
              print(f"No se pudo consultar el Release: HTTP {error.code}")
              raise
          PY
      - name: Download ONNX model from release
        if: ${{ env.MODEL_TOKEN != '' }}
        env:
          MODEL_URL: https://github.com/AndreBN14/Nerilum-TCSM/releases/download/v1.0.0/nerilum-alzheimer-mri-classifier.onnx
        run: python scripts/download_model.py
      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Deploy to Render (backend)
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: backend-deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACK }}
    steps:
      - name: Trigger Render deploy
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl -X POST -fsS --retry 3 --retry-all-errors "${{ env.RENDER_DEPLOY_HOOK }}"